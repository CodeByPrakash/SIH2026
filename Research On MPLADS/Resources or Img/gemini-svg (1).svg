    <rect x="455" y="81" width="38" height="38" rx="8" fill="#ccfbf1"/>
    <text x="474" y="106" text-anchor="middle" font-size="19">📱</text>
    <text x="503" y="96" fill="#0f172a" font-size="15" font-weight="700">Field Inspection App</text>
    <text x="503" y="113" fill="#0d9488" font-size="12" font-weight="600">React Native • Expo • TypeScript</text>
    <text x="455" y="145" fill="#475569" font-size="12">Geo-Tagged Media Upload &amp; Push Alerts</text>

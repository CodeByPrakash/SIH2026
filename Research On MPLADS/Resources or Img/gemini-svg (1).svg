  <!-- Card 1: Web Portals -->
  <g filter="url(#ppt-shadow)">
    <rect x="70" y="68" width="350" height="98" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.5"/>
    <rect x="85" y="81" width="38" height="38" rx="8" fill="#ccfbf1"/>
    <text x="104" y="106" text-anchor="middle" font-size="19">💻</text>
